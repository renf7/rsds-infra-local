name: Go build and tests
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26'
          cache: false
      - name: Format tests and vet
        run: |
          test -z "$(gofmt -l cmd)"
          go test -race ./...
          go vet ./...
      - name: Build native targets without extra runtimes
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath -o out/rsds-local.exe ./cmd/rsds-local
          GOOS=linux GOARCH=amd64 go build -trimpath -o out/rsds-local-linux ./cmd/rsds-local
          GOOS=darwin GOARCH=arm64 go build -trimpath -o out/rsds-local-macos ./cmd/rsds-local
